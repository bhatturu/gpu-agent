///
/// \file
/// objects and APIs for Universal Accelerated Link (UAL)
///
//----------------------------------------------------------------------------

syntax = "proto3";
package amdgpu;
option go_package="gen/amdgpu";

import "types.proto";

// NOTE:
//
// 1. this file captures UAL functionality in generic way irrespective
//    of the underlying hardware implementation of the functionality
//
// 2. underlying backend transport in the scale up network can be
//    UAL or UALoE or IFoE based on the capabilities of underlying hardware,
//    but these APIs are designed to be agnostic as much as possible
//    (however, currently only IFoE is supported)
//
// Object Modeling Design:
//
// 1. Each GPU has a PF and if operating in virtualization mode, there are
//    corresonding VFs as well
// 2. There is one accelerator id per GPU (allocated by agent) and assigned
//    during initial configuration time (using UAL APIs here)
// 3. Each GPU (PF/VF) device has corresponding UAL (pcie) device
// 4. Each UAL device has multiple UAL stations underneath and those are
//    configured either by UAL device level API (which applies the config
//    to all UAL stations/ports under that) or individual station/port level
//    APIs
// 5. Each UAL device can communication with many remote accelerators (1024 or
//    more depending on h/w capabilities)
//
// The hierachy of objects looks like below:
//
// UAL device -> UAL stations -> UAL ports
//
// A UAL device is 1-1 with PCIe device of a GPU PF/VF device
//
// UAL
//  - A given UAL device can have multiple UAL stations under it
//  - Each UAL station can handle upto 800Gbs by interfacing with mutilple
//    ports under it
//  - Each port can be 1x800G, 2x400G, 4x200G (a subset of this or other
//    combinations might be possible based on the h/w capabilites)

// gRPC APIs to manage UAL functions
service UALSvc {
  // UAL network port update API
  rpc UALNetworkPortUpdate(UALNetworkPortUpdateRequest) returns (UALNetworkPortUpdateResponse) {}
  // UAL network port get API
  rpc UALNetworkPortGet(UALNetworkPortGetRequest) returns (UALNetworkPortGetResponse) {}

  // UAL station update API
  rpc UALStationUpdate(UALStationUpdateRequest) returns (UALStationUpdateResponse) {}
  // UAL station get API
  rpc UALStationGet(UALStationGetRequest) returns (UALStationGetResponse) {}

  // UAL device get API
  rpc UALDeviceGet(UALDeviceGetRequest) returns (UALDeviceGetResponse) {}
  // UAL device update API
  rpc UALDeviceUpdate(UALDeviceUpdateRequest) returns (UALDeviceUpdateResponse) {}
  // UAL device reset
  rpc UALDeviceReset(UALDeviceResetRequest) returns (UALDeviceResetResponse) {}

  // UAL path to network port map update API
  rpc UALPathToNetworkPortMapUpdate(UALPathToNetworkPortMapUpdateRequest)
    returns (UALPathToNetworkPortMapUpdateResponse) {}
}

// UAL network port admin/oper states
enum UALPortState {
  // UAL port state invalid/unknown
  UAL_PORT_STATE_NONE      = 0;
  // UAL port is powered off
  UAL_PORT_STATE_POWER_OFF = 1;
  // UAL port is powered on but traffic flow not enabled
  UAL_PORT_STATE_IDLE      = 2;
  // UAL port is fully enabled for traffic flow
  UAL_PORT_STATE_ENABLED   = 3;
}

// network port speeds
enum UALPortSpeed {
  // port speed unknown or unspecified
  UAL_PORT_SPEED_NONE = 0;
  // 400G port speed
  UAL_PORT_SPEED_400G = 1;
  // 800G port speed
  UAL_PORT_SPEED_800G = 2;
}

// accelerator identifier and corresponding MAC address
message AcceleratorMAC {
  // accelerator id
  uint32 AcceleratorId = 1;
  // MAC address of the accelerator
  bytes  MACAddress    = 2;
}

// UAL port loopback mode
enum UALPortLoopbackMode {
  // UAL port loopback mode invalid/unknown
  UAL_PORT_LOOPBACK_MODE_NONE        = 0;
  // UAL port loopback mode auto
  UAL_PORT_LOOPBACK_MODE_AUTO        = 1;
  // UAL port loopback mode post MAC
  UAL_PORT_LOOPBACK_MODE_POST_MAC    = 2;
  // UAL port loopback mode post PCS
  UAL_PORT_LOOPBACK_MODE_POST_PCS    = 3;
  // UAL port loopback mode post PMA
  UAL_PORT_LOOPBACK_MODE_POST_PMA    = 4;
  // UAL port loopback mode post MDI WS
  UAL_PORT_LOOPBACK_MODE_POST_MDI_WS = 5;
  // UAL port loopback mode post PMA WS
  UAL_PORT_LOOPBACK_MODE_POST_PMA_WS = 6;
  // UAL port loopback mode post PCS WS
  UAL_PORT_LOOPBACK_MODE_POST_PCS_WS = 7;
  // UAL port loopback mode post MAC WS
  UAL_PORT_LOOPBACK_MODE_POST_MAC_WS = 8;
  // UAL port loopback mode post pre MAC
  UAL_PORT_LOOPBACK_MODE_PRE_MAC     = 9;
}

// UAL Forward Error Correction (FEC) mode
enum UALFECMode {
  // no FEC
  UAL_FEC_MODE_NONE       = 0;
  // BASE-R FEC
  UAL_FEC_MODE_BASER      = 1;
  // Reed-Solomon FEC
  UAL_FEC_MODE_RS         = 2;
  // Reed-Solomon FEC with interleaving
  UAL_FEC_MODE_RS_INT     = 3;
  // ethernet consortium low latency RS-FEC
  UAL_FEC_MODE_ETCS_RS_LL = 4;
  // auto-negotiate FEC mode
  UAL_FEC_MODE_AUTO       = 5;
}

// physical or logical UAL/UALoE/IFoE link state
// NOTE:
// UAL station has logical link that consists of potentially multiple
// physical links
enum UALLinkState {
  // unknown/invalid link state
  UAL_LINK_STATE_NONE = 0;
  // link state is up
  UAL_LINK_STATE_UP   = 1;
  // link state is down
  UAL_LINK_STATE_DOWN = 2;
}

// configuration specification of the UAL network port
message UALNetworkPortSpec {
  // globally unique identifier of the network port
  bytes                   Id             = 1;
  // network station the port is associated with
  bytes                   UALStation     = 2;
  // admin state of the port
  UALPortState            AdminState     = 3;
  // MAC address used for network traffic (e.g. IFoE)
  bytes                   NwMACAddress   = 4;
  // MAC address for out-of-band communication
  bytes                   OOBMACAddress  = 5;
  // list of accelerators and their MAC address
  // NOTE:
  // this is mutable only in PROVIDER config phase
  repeated AcceleratorMAC AcceleratorMAC = 6;
  // set AutoNegEn to true to enable auto negotiation
  bool                    AutoNegEn      = 7;
  // forward error correction type
  UALFECMode              FECMode        = 8;
  // loopback mode
  UALPortLoopbackMode     LoopbackMode   = 9;
}

// operational status of UAL network port
message UALNetworkPortStatus {
  // name of the network port
  string        Name                       = 1;
  // logical index of the network port
  // TODO:
  // 1. is this unique across all stations of a given GPU?
  // 2. is this unique across all stations of all GPUs in a compute rack?
  uint32        LogicalIndex               = 2;
  // local (to the station) port index (starts from 0)
  uint32        LocalPortIndex             = 3;
  // operational state of the port
  UALLinkState  LinkState                  = 4;
  // comma separated string indicating status of UAL network port
  string        LinkStatus                 = 5;
  // speed at which port is operating at (in Gbps)
  UALPortSpeed  Speed                      = 6;
  // time taken to complete link training for most recent link up (in msec)
  uint64        LinkTrainingDurationLatest = 7;
  // average time taken to complete link training (in msec)
  uint64        LinkTrainingDurationAvg    = 8;
  // number of times that the network link has come up
  uint32        LinkUpCount                = 9;
  // total time that the network link has been up in (msec)
  uint64        LinkUpDuration             = 10;
  // total time that the network link has been down in (msec)
  uint64        LinkDownDuration           = 11;
  // TX LLR status fields
  // last ACKed sequence number
  uint64        TxLLRAckedSeq              = 12;
  // TX data age timer value
  uint64        TxLLRDataAgeTimer          = 13;
  // amount of outstanding data in TX buffer
  uint64        TxLLROutstandingData       = 14;
  // outstanding sequence number in TX buffer
  uint64        TxLLROutstandingSeq        = 15;
  // PCS lost status timer value
  uint64        TxLLRPCSLostStatusTimer    = 16;
  // replay timer value
  uint64        TxLLRReplayTimer           = 17;
  // round trip time estimate
  uint64        TxLLRRTTEstimate           = 18;
  // current TX sequence number
  uint64        TxLLRTxSeq                 = 19;
  // RX LLR status fields
  // next expected RX sequence number
  uint64        RxLLRNextRxSeq             = 20;
}

// statistics of a UAL network port
message UALNetworkPortStats {
  // current number of streams currently in failover state and remapped
  // to an alternative network port
  uint32 NumFailedoverStreams                 = 1;
  // number of streams currently in paused state due to retrasmission
  // timeout and failover is either not possible or failover is disabled
  uint32 NumPausedStreams                     = 2;
  // current Bit Error Rate (BER) reported by the network port expressed as
  // errors per 10^12 bits
  uint64 BitErrorRate                         = 3;
  // total number of FEC codewords with 0 symbol errors
  uint64 FECCodeWordSymbolErrors0             = 4;
  // total number of FEC codewords with 1 symbol error
  uint64 FECCodeWordSymbolErrors1             = 5;
  // total number of FEC codewords with 2 symbol errors
  uint64 FECCodeWordSymbolErrors2             = 6;
  // total number of FEC codewords with 3 symbol errors
  uint64 FECCodeWordSymbolErrors3             = 7;
  // total number of FEC codewords with 4 symbol errors
  uint64 FECCodeWordSymbolErrors4             = 8;
  // total number of FEC codewords with 5 symbol errors
  uint64 FECCodeWordSymbolErrors5             = 9;
  // total number of FEC codewords with 6 symbol errors
  uint64 FECCodeWordSymbolErrors6             = 10;
  // total number of FEC codewords with 7 symbol errors
  uint64 FECCodeWordSymbolErrors7             = 11;
  // total number of FEC codewords with 8 symbol errors
  uint64 FECCodeWordSymbolErrors8             = 12;
  // total number of FEC codewords with 9 symbol errors
  uint64 FECCodeWordSymbolErrors9             = 13;
  // total number of FEC codewords with 10 symbol errors
  uint64 FECCodeWordSymbolErrors10            = 14;
  // total number of FEC codewords with 11 symbol errors
  uint64 FECCodeWordSymbolErrors11            = 15;
  // total number of FEC codewords with 12 symbol errors
  uint64 FECCodeWordSymbolErrors12            = 16;
  // total number of FEC codewords with 13 symbol errors
  uint64 FECCodeWordSymbolErrors13            = 17;
  // total number of FEC codewords with 14 symbol errors
  uint64 FECCodeWordSymbolErrors14            = 18;
  // total number of FEC codewords with 15 symbol errors
  uint64 FECCodeWordSymbolErrors15            = 19;
  // total number of FEC codewords that are uncorrectable
  uint64 FECCodeWordSymbolErrorsUncorrectable = 20;
  // ethernet network port TX stats
  // total number of bytes transmitted
  uint64 TxTotalBytes                         = 21;
  // total number of good bytes transmitted
  uint64 TxTotalGoodBytes                     = 22;
  // total number of bad bytes transmitted
  uint64 TxTotalErrBytes                      = 23;
  // total number of packets transmitted
  uint64 TxTotalPackets                       = 24;
  // total number of good packets transmitted
  uint64 TxTotalGoodPackets                   = 25;
  // total number of packets with frame error
  uint64 TxFrameError                         = 26;
  // total number of packets with bad FCS
  uint64 TxBadFCS                             = 27;
  // total number of 64-byte packets transmitted
  uint64 TxPacket64Bytes                      = 28;
  // total number of 65 to 127 byte packets transmitted
  uint64 TxPacket65To127Bytes                 = 29;
  // total number of 128 to 255 byte packets transmitted
  uint64 TxPacket128To255Bytes                = 30;
  // total number of 256 to 511 byte packets transmitted
  uint64 TxPacket256To511Bytes                = 31;
  // total number of 512 to 1023 byte packets transmitted
  uint64 TxPacket512To1023Bytes               = 32;
  // total number of 1024 to 1518 byte packets transmitted
  uint64 TxPacket1024To1518Bytes              = 33;
  // total number of 1519 to 1522 byte packets transmitted
  uint64 TxPacket1519To1522Bytes              = 34;
  // total number of 1523 to 1548 byte packets transmitted
  uint64 TxPacket1523To1548Bytes              = 35;
  // total number of 1549 to 2047 byte packets transmitted
  uint64 TxPacket1549To2047Bytes              = 36;
  // total number of 2048 to 4095 byte packets transmitted
  uint64 TxPacket2048To4095Bytes              = 37;
  // total number of 4096 to 8191 byte packets transmitted
  uint64 TxPacket4096To8191Bytes              = 38;
  // total number of 8192 to 9215 byte packets transmitted
  uint64 TxPacket8192To9215Bytes              = 39;
  // total number of packets over 9215 bytes transmitted
  uint64 TxPacketLarge                        = 40;
  // total number of good unicast packets transmitted
  uint64 TxUnicast                            = 41;
  // total number of good multicast packets transmitted
  uint64 TxMulticast                          = 42;
  // total number of good broadcast packets transmitted
  uint64 TxBroadcast                          = 43;
  // total number of 802.1Q VLAN tagged packets transmitted
  uint64 TxVLAN                               = 44;
  // total number of 802.3x MAC pause packets transmitted
  uint64 TxPause                              = 45;
  // total number of priority based pause packets transmitted
  uint64 TxUserPause                          = 46;
  // total number of padding bytes added
  uint64 TxTotalPadBytes                      = 47;
  // total number of packets that were padded
  uint64 TxTotalPadPackets                    = 48;
  // ethernet network port RX stats
  // total number of bytes received
  uint64 RxTotalBytes                         = 49;
  // total number of good bytes received
  uint64 RxTotalGoodBytes                     = 50;
  // total number of bad bytes received
  uint64 RxTotalErrBytes                      = 51;
  // total number of packets received
  uint64 RxTotalPackets                       = 52;
  // total number of good packets received
  uint64 RxTotalGoodPackets                   = 53;
  // total number of small packets (less than 64 bytes) received
