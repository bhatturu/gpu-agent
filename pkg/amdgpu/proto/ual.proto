  // count of FEC uncorrected codewords
  uint64 RxFECUncorrectedCodewords            = 86;
  // count of FEC codeword B for interleaved FEC modes
  uint64 RxFECCodewordB                       = 87;
  // count of FEC corrected codeword B for interleaved FEC modes
  uint64 RxFECCorrectedCodewordB              = 88;
  // count of FEC uncorrected codeword B for interleaved FEC modes
  uint64 RxFECUncorrectedCodewordB            = 89;
  // number of bits corrected from 0 to 1 by RX FEC on lane 0
