  // total number of packets with bad FCS (64 to max length)
  uint64 RxPacketBadFCS                       = 58;
  // total number of packets with stomped FCS
  uint64 RxStompedFCS                         = 59;
  // total number of truncated packets
  uint64 RxTruncated                          = 60;
  // total number of 64-byte packets received
  uint64 RxPacket64Bytes                      = 61;
  // total number of 65 to 127 byte packets received
  uint64 RxPacket65To127Bytes                 = 62;
  // total number of 128 to 255 byte packets received
  uint64 RxPacket128To255Bytes                = 63;
  // total number of 256 to 511 byte packets received
  uint64 RxPacket256To511Bytes                = 64;
  // total number of 512 to 1023 byte packets received
  uint64 RxPacket512To1023Bytes               = 65;
  // total number of 1024 to 1518 byte packets received
  uint64 RxPacket1024To1518Bytes              = 66;
  // total number of 1519 to 1522 byte packets received
  uint64 RxPacket1519To1522Bytes              = 67;
  // total number of 1523 to 1548 byte packets received
  uint64 RxPacket1523To1548Bytes              = 68;
  // total number of 1549 to 2047 byte packets received
  uint64 RxPacket1549To2047Bytes              = 69;
  // total number of 2048 to 4095 byte packets received
  uint64 RxPacket2048To4095Bytes              = 70;
  // total number of 4096 to 8191 byte packets received
  uint64 RxPacket4096To8191Bytes              = 71;
  // total number of 8192 to 9215 byte packets received
  uint64 RxPacket8192To9215Bytes              = 72;
  // total number of packets longer than max length
  uint64 RxTooLong                            = 73;
  // total number of large packets (greater than 9215 bytes) received
  uint64 RxPacketLarge                        = 74;
  // total number of packets longer than max length with bad FCS
