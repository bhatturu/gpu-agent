  // total number of received unicast packets
  uint64 RxUnicast                            = 77;
  // total number of received multicast packets
  uint64 RxMulticast                          = 78;
  // total number of received broadcast packets
  uint64 RxBroadcast                          = 79;
  // total number of received VLAN tagged packets
  uint64 RxVLAN                               = 80;
  // total number of received 802.3x pause packets
