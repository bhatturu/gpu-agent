  // number of bits corrected from 0 to 1 by RX FEC on lane 1
  uint64 RxFECBitErr0To1Lane1                 = 91;
  // number of bits corrected from 0 to 1 by RX FEC on lane 2
  uint64 RxFECBitErr0To1Lane2                 = 92;
  // number of bits corrected from 0 to 1 by RX FEC on lane 3
  uint64 RxFECBitErr0To1Lane3                 = 93;
  // number of bits corrected from 1 to 0 by RX FEC on lane 0
  uint64 RxFECBitErr1To0Lane0                 = 94;
  // number of bits corrected from 1 to 0 by RX FEC on lane 1
  uint64 RxFECBitErr1To0Lane1                 = 95;
  // number of bits corrected from 1 to 0 by RX FEC on lane 2
  uint64 RxFECBitErr1To0Lane2                 = 96;
  // number of bits corrected from 1 to 0 by RX FEC on lane 3
  uint64 RxFECBitErr1To0Lane3                 = 97;
  // count of FEC symbol errors corrected on FEC lane 0
  uint64 RxFECSymbolErrCountLane0             = 98;
  // count of FEC symbol errors corrected on FEC lane 1
  uint64 RxFECSymbolErrCountLane1             = 99;
  // count of FEC symbol errors corrected on FEC lane 2
  uint64 RxFECSymbolErrCountLane2             = 100;
  // count of FEC symbol errors corrected on FEC lane 3
  uint64 RxFECSymbolErrCountLane3             = 101;
  // TX LLR statistics
  // count of ACK control symbols transmitted
  uint64 TxLLRAckCtlOS                        = 102;
  // count of NACK control symbols transmitted
  uint64 TxLLRNackCtlOS                       = 103;
  // count of INIT control symbols transmitted
